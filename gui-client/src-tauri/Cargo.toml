[package]
name = "claude-sync-gui"
version = "0.1.0"
description = "Claude Sync GUI Client"
authors = ["Claude Sync Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "claude_sync_gui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.11"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
dirs = "5.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# HTTP 客户端（用于与服务器通信）
reqwest = { version = "0.11", features = ["json"] }

# SHA256 哈希
sha2 = "0.10"

# 图像处理（用于托盘图标）
image = "0.25"

# 正则表达式
regex = "1"

# 获取主机名
gethostname = "0.4"

# gRPC 客户端
tonic = "0.11"
prost = "0.12"
tokio-stream = "0.1"
base64 = "0.21"

# 自动启动插件
tauri-plugin-autostart = "2"

[features]
default = []
