[package]
name = "claude-sync-gui"
version = "0.1.0"
description = "Claude Sync GUI Client"
authors = ["Claude Sync Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "fs-rename-file", "fs-copy-file", "dialog-save", "fs-read-dir", "dialog-open", "path-all", "notification-all", "fs-create-dir", "fs-remove-file", "fs-read-file", "fs-exists", "dialog-message", "dialog-confirm", "fs-write-file", "dialog-ask", "fs-remove-dir", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
dirs = "5.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP 客户端（用于与服务器通信）
reqwest = { version = "0.11", features = ["json"] }

# SHA256 哈希
sha2 = "0.10"

# 获取主机名
gethostname = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
